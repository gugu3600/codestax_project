version: '3.8'

services:
  backend-api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - "./backend/.env"
    networks:
      - app-network

  frontend-app:
    build: ./frontend
    ports:
      - "3000:80"
    env_file:
      - "./frontend/.env"
    depends_on:
      - backend-api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge